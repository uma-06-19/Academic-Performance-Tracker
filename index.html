<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Academic Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="logo">EduStats Pro</div>
        <ul>
            <li><a href="#" onclick="showPage('home')">Home</a></li>
            <li><a href="#" onclick="showPage('tracker')">Tracker</a></li>
            <li><a href="#" onclick="showPage('reports')">Reports</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- PAGE 1: HOME -->
        <section id="home" class="page active">
            <div class="hero">
                <h1>Welcome to Student Performance Analytics</h1>
                <p>Manage your academic journey with precision and ease.</p>
                <button onclick="showPage('tracker')">Get Started</button>
            </div>
        </section>

        <!-- PAGE 2: TRACKER (Input Page) -->
        <section id="tracker" class="page">
            <h2>Data Entry Dashboard</h2>
            <div class="input-group">
                <input type="text" id="subject" placeholder="Enter Subject Name">
                <input type="number" id="marks" placeholder="Enter Marks">
                <button onclick="addEntry()">Add Subject</button>
            </div>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>

        <!-- PAGE 3: REPORTS (Analysis Page) -->
        <section id="reports" class="page">
            <h2>Performance Report</h2>
            <div class="report-card">
                <div class="stat">
                    <h3>Total Subjects</h3>
                    <p id="totalSub">0</p>
                </div>
                <div class="stat">
                    <h3>Overall Average</h3>
                    <p id="avgVal">0%</p>
                </div>
                <div class="stat">
                    <h3>Performance Grade</h3>
                    <p id="grade">N/A</p>
                </div>
            </div>
            <button class="reset-btn" onclick="resetAll()">Clear All Records</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
